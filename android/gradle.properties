# AndroidX statt der alten Support-Bibliothek. Ohne dieses Flag bricht jeder
# Build ab, sobald eine androidx-Abhaengigkeit im Klassenpfad liegt — und
# Compose besteht vollstaendig daraus.
android.useAndroidX=true

# R-Klassen enthalten nur die Ressourcen des eigenen Moduls statt zusaetzlich
# aller Abhaengigkeiten. Kleinere Builds, kuerzere Kompilierzeiten.
android.nonTransitiveRClass=true

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

# Baut Divido fuer Android. Linux-Runner statt macOS: Android-Builds brauchen
# keinen Mac, und Linux-Minuten werden einfach statt zehnfach abgerechnet.
#
# Der core-Job laeuft bei jedem Push, weil er Sekunden dauert und kein SDK
# braucht. Das signierte Bundle entsteht nur auf Anforderung.
name: Android

on:
  push:
    branches: [ "main" ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      bundle:
        description: 'Signiertes AAB bauen (braucht die Keystore-Secrets)'
        type: boolean
        default: false

defaults:
  run:
    working-directory: android

jobs:
  core:
    name: Kern testen (ohne Android SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Kern testen
        run: gradle --no-daemon :core:test
      - name: Testbericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: android/core/build/reports/tests/test/
          if-no-files-found: warn

  bundle:
    name: Signiertes Bundle
    needs: core
    if: github.event_name == 'workflow_dispatch' && inputs.bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore ablegen
        env:
          KEYSTORE_BASE64: ${{ secrets.DIVIDO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret DIVIDO_KEYSTORE_BASE64 fehlt"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          chmod 600 "$RUNNER_TEMP/upload.jks"

      - name: Bundle bauen
        env:
          DIVIDO_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          DIVIDO_KEYSTORE_PASSWORD: ${{ secrets.DIVIDO_KEYSTORE_PASSWORD }}
          DIVIDO_KEY_ALIAS: divido-upload
        run: gradle --no-daemon :app:bundleRelease

      - name: Keystore entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: divido-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

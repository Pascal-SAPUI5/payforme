# Baut Umlage signiert und laedt es zu TestFlight hoch.
#
# WICHTIG - Bundle-ID und Team:
# Im Projekt stehen de.mayflower.Umlage und Team 22BT3L9N5V. Beides gehoert
# dem urspruenglichen Entwickler, nicht uns. Unter fremder Bundle-ID nimmt App
# Store Connect keinen Upload an.
#
# Deshalb werden beide Werte hier ausschliesslich zur Buildzeit per xcodebuild
# ueberschrieben und NICHT in project.pbxproj geaendert. Sonst wanderte die
# Aenderung in jeden Upstream-PR und schriebe dem Maintainer seine App-Identitaet
# um. Das Repo bleibt so, wie upstream es erwartet.
#
# Benoetigte Secrets (pro Repository, nicht kontoweit - aus einem anderen
# Projekt werden sie NICHT uebernommen):
#   ASC_KEY_P8      Inhalt der AuthKey_<KEYID>.p8
#   ASC_KEY_ID      Key-ID (steht im Dateinamen)
#   ASC_ISSUER_ID   Issuer-ID aus App Store Connect
#   APPLE_TEAM_ID   Deine Team-ID (10 Zeichen)
#
# Benoetigte Variable (Settings > Secrets and variables > Actions > Variables):
#   TF_BUNDLE_ID    Deine eigene Bundle-ID, z.B. de.wachowski.payforme
#                   Muss vorher in App Store Connect als App angelegt sein.
#
# Kosten: macOS-Runner zaehlen bei privaten Repos 10-fach. Deshalb laeuft das
# hier nur manuell oder auf einem tf-*-Tag, nicht bei jedem Push.
name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - "tf-*"

jobs:
  build:
    # Schutz, falls diese Datei je upstream landet: dann darf sie dort nicht
    # versuchen, fremden Code unter unserem Account hochzuladen.
    if: github.repository == 'Pascal-SAPUI5/payforme'
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Konfiguration pruefen
        env:
          TF_BUNDLE_ID: ${{ vars.TF_BUNDLE_ID }}
        run: |
          if [ -z "$TF_BUNDLE_ID" ]; then
            echo "::error::Variable TF_BUNDLE_ID fehlt. Trage deine eigene Bundle-ID ein."
            echo "Settings > Secrets and variables > Actions > Variables > New repository variable"
            exit 1
          fi
          echo "Baue als: $TF_BUNDLE_ID"

      # App Store Connect lehnt Uploads mit bereits vergebener Build-Nummer ab.
      # Die Run-Nummer waechst monoton. CFBundleVersion steht in der Info.plist
      # als Literal (nicht als $(CURRENT_PROJECT_VERSION)), deshalb PlistBuddy.
      - name: Build-Nummer setzen
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Umlage/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Umlage/Info.plist

      - name: App-Store-Connect-Schluessel ablegen
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      # Entitlements sind leer, es gibt also keine Capability auszuhandeln:
      # -allowProvisioningUpdates legt das Profil selbst an.
      - name: Archivieren (signiert)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TF_BUNDLE_ID: ${{ vars.TF_BUNDLE_ID }}
        run: |
          xcodebuild archive \
            -project Umlage.xcodeproj \
            -scheme Umlage \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Umlage.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$TF_BUNDLE_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

      - name: Exportoptionen schreiben
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST

      - name: IPA exportieren
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Umlage.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -lh "$RUNNER_TEMP/export"

      - name: Zu TestFlight hochladen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          echo "Lade hoch: $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Schluessel entfernen
        if: always()
        run: rm -rf ~/private_keys

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payforme-testflight-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14
